<html>
    <head>
        <title>Usando variaveis</title>
    </head>
    <body>
        <script>
            let valor1 = 18;
            let valor2 = 25.9;
            let valor3 = "Vitor";
            let valor4 = "Grilo";
            let valor5 = false;
            console.log( "valor1 = " + valor1 );
            console.log( "valor1 = " , valor1 );

            let i = 1;
            // estrutura de repeticao while
            while( i <= 10 ){
                console.log( i, " elefante(s) incomoda(m)" );
                i = i + 1;
            }
            //i = null;

            // estrutura de repeticao for
            for( let j=1; j<= 10; j=j+1 ){
                console.log( j, " abelhas(s) incomoda(m)" );
            }
        </script>
    </body>
</html>
