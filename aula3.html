<html>
    <head>
        <title>Usando variaveis</title>
    </head>
    <body>
        <script>
            // condicional switch-case
            var1 = 10
            switch ( var1 ) {
                case 10:
                    console.log("dez");
                break
                case 15:
                    console.log("quinze");
                break
                case 17:
                    console.log("desessete");
                break
                case 25:
                    console.log("vinte e cinco");
                break
                default:
                    console.log( "valor não encontrado" );
                break
            };
        </script>
    </body>
</html>
